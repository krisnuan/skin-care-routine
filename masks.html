<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Масочки | Твой уход за кожей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            padding: 24px 20px;
            
            background-image: url('https://images.unsplash.com/photo-1670201202802-5ec2423282ff?q=80&w=1823&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: rgba(0, 0, 0, 0.3);
            background-blend-mode: overlay;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: inherit;
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        }

        .page-title {
            font-size: clamp(1.8rem, 5vw, 2.2rem);
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .animated-icon {
            display: inline-block;
            animation: gentleWobble 3s ease-in-out infinite;
            filter: drop-shadow(0 0 5px rgba(255, 200, 80, 0.5));
        }

        @keyframes gentleWobble {
            0%, 100% { transform: rotate(0deg) scale(1); filter: drop-shadow(0 0 5px rgba(255, 200, 80, 0.4)); }
            50% { transform: rotate(8deg) scale(1.1); filter: drop-shadow(0 0 15px rgba(255, 200, 80, 0.8)); }
        }

        .empty-state {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 60px 32px;
            text-align: center;
            margin: 40px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 24px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .empty-state h2 {
            color: #FFE8B6;
            font-size: 1.8rem;
            margin-bottom: 16px;
        }

        .empty-state p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            line-height: 1.6;
            max-width: 400px;
            margin: 0 auto;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #ffd966, rgba(255, 217, 102, 0.3));
            margin: 24px auto;
            border-radius: 3px;
        }

        .preview-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin: 32px 0 20px;
        }

        .preview-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #FFE8B6;
        }

        footer {
            text-align: center;
            margin-top: 56px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        footer a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        footer a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .empty-state { padding: 40px 24px; }
            .empty-icon { font-size: 60px; }
            .preview-item { padding: 6px 16px; font-size: 12px; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container { animation: fadeIn 0.5s ease; }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <span class="page-title">
                <span class="animated-icon">💆‍♀️</span> Масочки
            </span>
        </div>

        <div class="empty-state">
            <div class="empty-icon">🧴✨</div>
            <h2>Скоро здесь появятся маски</h2>
            <div class="divider"></div>
            <p>Планируются: гидрогелевые, тканевые, ночные маски и детокс-маски для пор.</p>
            <div class="preview-list">
                <span class="preview-item">💧 Увлажняющие</span>
                <span class="preview-item">🧹 Очищающие</span>
                <span class="preview-item">✨ Сияющие</span>
                <span class="preview-item">🛡️ Барьерные</span>
            </div>
            <p style="margin-top: 20px; font-size: 0.9rem;">💤 ожидайте обновлений</p>
        </div>

        <footer><a href="index.html">← Вернуться на главную</a></footer>
    </div>
</body>
</html>
